
name: Build ImageTextEditor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract Project ZIP
        run: |
          mkdir project
          unzip ImageTextEditor-Premium-TealGold.zip -d project

      - name: Build Debug APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageTextEditor-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
